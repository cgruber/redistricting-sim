<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Character Asset Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a101e;
      color: #c8d8f0;
      font-family: monospace;
      font-size: 13px;
      padding: 24px;
    }
    h1 { color: #7ba8e0; font-size: 1.4rem; margin-bottom: 24px; }
    h2 { color: #5090c0; font-size: 1.1rem; margin: 32px 0 12px; border-bottom: 1px solid #1a3060; padding-bottom: 6px; }
    h3 { color: #4070a0; font-size: 0.9rem; margin: 16px 0 8px; }
    p  { color: #607090; font-size: 0.8rem; margin-top: 4px; text-align: center; }

    .demo-block { margin-bottom: 48px; }

    /* Full sheet */
    .sheet-wrap { border: 1px solid #1a3060; display: inline-block; }
    .sheet-wrap img { display: block; max-width: 100%; }

    /* CSS-sliced crops (what the game currently renders) */
    .crops-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .crop-cell { text-align: center; }

    .sprite-crop {
      width: 122px;
      height: 200px;
      background-repeat: no-repeat;
      background-size: 300% auto;
      border: 1px solid #2a4060;
      display: block;
      margin: 0 auto;
    }

    /* Individual file crops (neutral.png / approve.png / disapprove.png) */
    .file-crop {
      width: 122px;
      height: 200px;
      object-fit: cover;
      object-position: top center;
      border: 1px solid #2a4060;
      display: block;
      margin: 0 auto;
    }
    .missing {
      width: 122px;
      height: 200px;
      border: 1px dashed #3a5070;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #3a5070;
      font-size: 0.75rem;
      text-align: center;
      margin: 0 auto;
    }

    .section-label {
      color: #405080;
      font-size: 0.75rem;
      margin: 20px 0 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .checkerboard {
      background-image:
        linear-gradient(45deg, #1a2030 25%, transparent 25%),
        linear-gradient(-45deg, #1a2030 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1a2030 75%),
        linear-gradient(-45deg, transparent 75%, #1a2030 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #0e1828;
    }
  </style>
</head>
<body>
  <h1>Character Asset Preview</h1>

  <script>
    const demos = ["wm", "bm", "af"];
    const poses = [
      { name: "neutral",    cssPos: "0%",    stars: "2 stars",  label: "Neutral (0%)" },
      { name: "approve",    cssPos: "50%",   stars: "3 stars",  label: "Approve (50%)" },
      { name: "disapprove", cssPos: "100%",  stars: "0–1 stars",label: "Disapprove (100%)" },
    ];

    for (const demo of demos) {
      const base = `assets/characters/governor-${demo}`;

      document.write(`<div class="demo-block">`);
      document.write(`<h2>governor-${demo}</h2>`);

      // Full sheet
      document.write(`<div class="section-label">Full sprite sheet (${base}/sheet.png)</div>`);
      document.write(`<div class="sheet-wrap checkerboard"><img src="${base}/sheet.png" onerror="this.alt='[sheet.png missing]'; this.style.width='400px'; this.style.height='100px';"></div>`);

      // CSS sprite crops (current game approach)
      document.write(`<div class="section-label">CSS-sliced crops — what the game currently renders</div>`);
      document.write(`<div class="crops-row">`);
      for (const pose of poses) {
        document.write(`
          <div class="crop-cell">
            <div class="sprite-crop checkerboard"
                 style="background-image: url('${base}/sheet.png'); background-position: ${pose.cssPos} 0%;"></div>
            <p>${pose.label}</p>
            <p style="color:#405070">${pose.stars}</p>
          </div>`);
      }
      document.write(`</div>`);

      // Individual file crops (if they exist)
      document.write(`<div class="section-label">Individual pose files (neutral/approve/disapprove.png) — generated crops</div>`);
      document.write(`<div class="crops-row">`);
      for (const pose of poses) {
        const src = `${base}/${pose.name}.png`;
        document.write(`
          <div class="crop-cell">
            <img class="file-crop checkerboard"
                 src="${src}"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
                 alt="${pose.name}">
            <div class="missing" style="display:none">${pose.name}.png<br>not generated yet</div>
            <p>${pose.name}.png</p>
          </div>`);
      }
      document.write(`</div>`);

      document.write(`</div>`); // demo-block
    }
  </script>
</body>
</html>
