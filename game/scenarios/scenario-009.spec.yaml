# Spec file for scenario-009: "Cats vs. Dogs"
# Source of truth for the map generation pipeline (GAME-126 migration).
# Generated output: game/scenarios/scenario-009.json
#
# Migrated from the legacy gen-scenario-009.main.kts (GAME-126). The shipped JSON had drifted
# from that script — per-criterion `character`, `party_id` on the party criteria,
# `instigator_character`, and `character_demographics` were added post-generation. This spec
# folds them in. Bones (the cat/dog reskin, the concentric ~58%-Cat geography, the pack-the-
# majority safe-seat lesson, and the "same game, different fur" narrative) are preserved.
#
# 009 is the reskin capstone: identical mechanics to the Ken/Ryu partisan scenarios, but with
# Cat/Dog parties — the point is that the redistricting tools are player-agnostic.
#
# Geography (confirmed against the shipped JSON, by hex-distance ring):
#   inner core (d <= 2):  cat 0.82 — dense Cat urban stronghold
#   ring       (d <= 4):  cat 0.72 — Cat-leaning inner suburbs
#   outer      (default): cat 0.42 — competitive/Dog outer precincts
# ~58% Cat overall — a comfortable majority the player must lock into >=3 unlosable seats.
#
# Draft simplifications (GAME-126):
#   - Uniform population (base 1500 +/- 150); no terrain/gradient shaping.
#   - County labels (catville / dogdale) split at d <= 3; cosmetic (precinct names).
#     (Verified against the shipped JSON + gen-scenario-009 countyId: catville is d <= 3.)

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: scenario-009
  title: "Cats vs. Dogs"
  election_type: state_house
  region:
    id: pawprint_county
    name: Pawprint County

# ── Stage 1: Map + terrain ────────────────────────────────────────────────────

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 6

terrain: {}

# ── Stage 2: Population ───────────────────────────────────────────────────────
#
# Uniform field: base 1500 +/- 150. population_balance tolerance is the looser ±10% here.

population:
  seed: 99
  base: 1500
  variance: 150

# ── Stage 3: Demographics ─────────────────────────────────────────────────────
#
# Concentric geography (first-match-wins, inner to outer):
#   d <= 2:  cat 0.82    d <= 4:  cat 0.72    default (d >= 5):  cat 0.42

demographics:
  seed: 99
  parties: [cat, dog]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: inner_core
      filter: { hex_dist_lte: 2 }
      party_base: { cat: 0.82 }
    - name: inner_ring
      filter: { hex_dist_lte: 4 }
      party_base: { cat: 0.72 }
    - name: outer
      filter: { default: true }
      party_base: { cat: 0.42 }
  county_labels:
    - id: catville
      filter: { hex_dist_lte: 3 }
    - id: dogdale
      filter: { default: true }

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    - { id: cat, name: Cat Party, abbreviation: CAT, color: "#c96d00" }
    - { id: dog, name: Dog Party, abbreviation: DOG, color: "#7b35a8" }
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
    - { id: d4, name: District 4 }
    - { id: d5, name: District 5 }
  default_district_id: d1
  # FAILING initial "old map": horizontal r-slabs (the gen script's initialDistrict, exact).
  # Consolidates rows into unequal bands (34/23/13/23/34) -> fails population_balance; the
  # bands also mix inner Cat core with outer Dog precincts -> not all Cat-safe. Reproduces
  # gen-scenario-009 via a max_r cascade:
  #   r<=-3 d5, r<=-1 d4, r<=0 d3, r<=2 d2, default(r>=3) d1.
  initial_district_rule:
    type: row_band
    bands:
      - { max_r: -3, district: d5 }
      - { max_r: -1, district: d4 }
      - { max_r: 0,  district: d3 }
      - { max_r: 2,  district: d2 }
      - { default: true, district: d1 }
  rules:
    population_tolerance: 0.10
    contiguity: required
  success_criteria:
    - id: sc-district-count
      required: true
      description: All five districts are in use and every precinct is assigned.
      criterion: { type: district_count }
      character: commissioner
    - id: sc-population-balance
      required: true
      description: All five districts have roughly equal population (within 10%).
      criterion: { type: population_balance }
      character: commissioner
    - id: sc-compactness
      required: true
      description: Districts must be geographically compact — no sprawling fur-balls (compactness ≥ 40%).
      criterion: { type: compactness, operator: gte, threshold: 0.40 }
      character: judge
    - id: sc-safe-seats-cat
      required: true
      description: The Cat Party must lock in at least 3 safe districts (winning margin ≥ 15 points).
      criterion: { type: safe_seats, party: cat, margin: 0.15, min_count: 3 }
      character: party
      party_id: cat
    - id: sc-safe-seats-dog
      required: false
      description: Even dogs deserve one safe seat — can you give the Dog Party at least 1 district won by 15+ points?
      criterion: { type: safe_seats, party: dog, margin: 0.15, min_count: 1 }
      character: party
      party_id: dog
  narrative:
    character:
      name: You
      role: Chief Map Strategist, Cat Party
      motivation: |-
        The Cat Party has controlled Pawprint County's legislature for years and intends to keep it that way. The census just came in. The lines need redrawing. Your job: make sure the Cats win at least three unlosable districts. The dogs are loud, but they don't have to be numerous.
    intro_slides:
      - heading: It's a Dog-Eat-Cat World
        body: |-
          The Cat Party has held the majority in Pawprint County for years. The Dog Party has been nipping at their heels.

          The census data is in. Boundaries must be redrawn. The Cat Party leadership has called you in for one reason: make it stick.
      - heading: The Math
        body: |-
          Cats make up about 60% of Pawprint County's voters — a comfortable majority in the urban core, but the outer precincts are more competitive.

          Left to chance, those outer districts could swing either way. Your job is to take chance out of the equation. Draw lines that turn a majority into a durable map.
      - heading: Same Game, Different Fur
        body: |-
          You've seen this before — packing, cracking, population balance, compactness. The tools are the same whether you're drawing for Cats, Dogs, Ken, Ryu, or anyone else.

          The rules of redistricting don't care about the players. Only the lines matter.
    objective: |-
      Draw a compact, population-balanced map that locks in at least 3 safe Cat Party districts (winning margin ≥ 15 points). Bonus: leave the dogs one safe seat to chew on.
  instigator_character: party
  character_demographics:
    commissioner: wm
    judge: naf
