# Spec file for tutorial-005: "Hawthorn Bend: A Three-Way Race"
# Source of truth for the map generation pipeline.
# Generated output: game/scenarios/tutorial-005.json
#
# Regenerate:  bazel run //game/web/src/pipeline:generate_scenario -- \
#                game/scenarios/tutorial-005.spec.yaml game/scenarios/tutorial-005.json
#
# PUBLIC TUTORIAL (GAME-112 PR 2 / GAME-120): the multiparty tutorial — the fifth rung of the
# tutorial ladder, promoted into the public "tutorial" campaign alongside 001–004 + 006 (GAME-121;
# see thoughts/shared/decisions/2026-07-05-tutorial-progression-and-multiparty-placement.md). Built
# on GAME-116's N-party demographics stage + GAME-043's party-agnostic runtime + GAME-112's
# two-party-normalized metrics + GAME-119 feature-anchored leans + GAME-117 named candidates.
#
# PEDAGOGY — three PARTIES, three corners (GAME-120):
#   A genuine three-cornered race: Ken out west, Ryu in the city, Chun-Li out east — three PARTIES,
#   each contesting every district (no independents; the home-base independent is GAME-121's job).
#   The lesson is T3's — the lines decide — extended to a third bloc: keep the east together and
#   Chun-Li carries that seat; crack it across districts and her ~40% base dilutes below plurality
#   everywhere (packing/cracking, applied to a third party). Who wins how many seats is EMERGENT
#   from how the player draws, not hard-coded.
#
#   Because the city (Hawthorn) is the population mass, a naive equal-COLUMN split over-fills the
#   centre (>±15%): the dense core needs the SMALLER district. The winnable map draws the centre
#   narrow and the rural wings wide — the same lesson tutorial-002 "A Legal Map" teaches.
#
#   Still a legal-map tutorial: gates district_count + population_balance + contiguity, NO seat goal.
#   The result is shown to READ (repaint, watch who wins move), not to chase.

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: tutorial-005
  title: "Hawthorn Bend: A Three-Way Race"
  election_type: state_house
  region:
    id: hawthorn_bend
    name: Hawthorn Bend

# ── Stage 1a: Map layout ──────────────────────────────────────────────────────
# Identical to T3 for familiarity (radius 5 = 91 precincts).

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 5

# ── Stage 1b: Terrain (COSMETIC scenery) ──────────────────────────────────────
# The same Bend river as T3 — cosmetic; districts may cross it freely.

terrain:
  river: { from: { q: 4, r: -5 }, via: [ { q: -2, r: 0 } ], to: { q: 0, r: 5 } }

# ── Stage 2: Population ───────────────────────────────────────────────────────
# T3's population shape: a central city (Hawthorn) on a rural base, with East Hollow and
# Westford villages. Hawthorn is the population mass — its density is why the winnable map
# draws the centre district narrow (see the pedagogy note at the top). UNTOUCHED from the
# draft: balance depends on population, so the geometry is left exactly as-is.

population:
  seed: 13
  base: 4000
  variance: 650
  smoothing: 0
  settlements:
    - label: Hawthorn (city)
      anchor: center
      peak: 3200
      radius: 2
      profile: plateau
    - label: East Hollow
      anchor: east
      peak: 1500
      radius: 2
      profile: gaussian
    - label: Westford
      anchor: west
      peak: 1500
      radius: 2
      profile: gaussian

# ── Stage 3: Demographics (THREE-WAY — a genuine three-cornered race) ──────────
#
# Three geographic bases, one per candidate, so three wedge districts can elect three
# different winners:
#   • WEST — Ken country (Sean carries the Ken banner).
#   • URBAN CORE — Hawthorn city leans Ryu (Sakura's base): the dense centre incl. the
#     hexes around the seat (0,0), (-1,0), (0,-1), (1,-1).
#   • EAST — Chun-Li's ground (Chun-Li carries her party's banner), a ~two-in-five base that leads
#     while the east stays together.
# Zone match is first-wins, so urban_core (a distance filter) precedes the q-band zones.
# GAME-116 weight model: primary (ken) gets base+jitter; the remainder (1 − ken) is split
# among the others by their party_base weights. Author all three to sum to ~1 for literal shares.

demographics:
  seed: 13
  parties: [ken, ryu, chunli]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: urban_core      # Hawthorn city core — Ryu (Sakura) country. Anchored on the
                            # seat (0,0); first-match, so it claims the dense centre before
                            # the flank zones' disks can reach in.
      filter: { near: { q: 0, r: 0 }, within: 2 }
      party_base: { ken: 0.25, ryu: 0.60, chunli: 0.15 }
    - name: westford        # Westford — Ken (Sean) country. Anchored on the western town.
      filter: { near: { q: -3, r: 0 }, within: 3 }
      party_base: { ken: 0.58, ryu: 0.28, chunli: 0.14 }
    - name: east_hollow     # East Hollow — Chun-Li's stronghold. Anchored on the eastern
                            # town (up the Bend, riverside).
      filter: { near: { q: 3, r: -1 }, within: 3 }
      party_base: { ken: 0.24, ryu: 0.24, chunli: 0.52 }
    - name: countryside     # rural remainder — leans Ryu, so a central seat is winnable
      filter: { default: true }
      party_base: { ken: 0.38, ryu: 0.46, chunli: 0.16 }

# ── Stage 3b: Counties ────────────────────────────────────────────────────────

counties:
  model: seat_and_hinterland
  target_count: 2
  id_prefix: hawthorn

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    # GAME-117 named candidates: candidates[districtId-1], one per district (d1,d2,d3). Each
    # party fields three people, so a multi-seat party win reads as different candidates. The
    # marquee face of each party sits in the district it carries on the intended map — Sean out
    # west (d1), Sakura in the city (d2), Chun-Li out east (d3).
    - id: ken
      name: Ken Party
      abbreviation: KEN
      color: "#c96d00"
      candidates: [Sean Matsuda, Eliza Masters, Ken Masters]
    - id: ryu
      name: Ryu Party
      abbreviation: RYU
      color: "#7b35a8"
      candidates: [Ryu, Sakura Kasugano, Gouken]
    # Chun-Li's party — the third bloc, strong out east. Teal, CVD-distinct from the
    # Ken orange and Ryu purple (palette slot 3).
    - id: chunli
      name: Chun-Li Party
      abbreviation: CHU
      color: "#2a9d8f"
      candidates: [Cammy White, Guile, Chun-Li]
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
  default_district_id: d1
  guided: true
  hide_election_results: false
  hide_view_toolbar: false
  rules:
    population_tolerance: 0.15
    contiguity: required
  success_criteria:
    - id: sc-district-count
      required: true
      description: All three districts are in use and every precinct is assigned.
      criterion: { type: district_count }
    - id: sc-population-balance
      required: true
      description: All three districts have roughly equal population (within 15%).
      criterion: { type: population_balance }
  narrative:
    character:
      name: You
      role: Mapmaker, Hawthorn Bend
      motivation: >
        Three parties are on the ballot across the Bend: the Ken Party out west, the Ryu Party in
        the city, and the Chun-Li Party out east. Each runs a candidate in every district — but
        each is strongest on its home ground. Three bases, three corners. Where you draw the lines
        decides how many seats each party wins.
    intro_slides:
      - heading: A Three-Cornered Race
        body: >
          The west is Ken country, where Sean Matsuda runs strong. The city core leans Ryu behind
          Sakura. And out east, along the Bend, the Chun-Li Party takes about two in five — ahead
          of both the others on its home ground.
      - heading: Three Bases, Three Corners
        body: >
          Each party has one part of the Bend. Draw a district around each base — west, city, east
          — and all three can carry a seat. Blur those lines and one base swallows another; split
          the east across districts and Chun-Li's two-in-five becomes a plurality nowhere.
      - heading: The Dense Centre Needs Less Land
        body: >
          Hawthorn city is where most people live. Carve three equal-width columns and the middle
          one bursts the balance limit. Like your last legal map, the crowded centre needs the
          SMALLER district — draw it narrow, and let the rural wings run wide.
    objective: >
      Draw three balanced, connected districts — a legal map, like before — and read the result.
      There's no seat to chase: the winners emerge from where you put the lines. Keep the eastern
      base whole and Chun-Li carries that seat; split it across districts and she's shut out —
      repaint and watch the three-cornered race shift.
    epilogue: >
      A third party changes the map. A party with a concentrated base is powerful when its ground
      stays together and powerless when it's split — the same packing-and-cracking that moves seats
      between two sides, now with three. And the crowded city taught the other half of the lesson:
      dense ground needs the smaller district, so the centre is drawn tight and the rural wings run
      wide. The lines don't just pick between two sides — they decide how many corners keep a seat.
