# Spec file for tutorial-005: "Hawthorn Bend: The Hollow's Champion"
# Source of truth for the map generation pipeline.
# Generated output: game/scenarios/tutorial-005.json
#
# Regenerate:  bazel run //game/web/src/pipeline:generate_scenario -- \
#                game/scenarios/tutorial-005.spec.yaml game/scenarios/tutorial-005.json
#
# DEBUG-ONLY DEMO (GAME-112 PR 2): the multiparty showcase. Reachable only via the gated
# "debug" campaign (GAME-115) — it does not ship to normal players. Built on GAME-116's N-party
# demographics stage + GAME-043's party-agnostic runtime + GAME-112's two-party-normalized metrics.
#
# PEDAGOGY — a THIRD force, an Independent:
#   A clone of tutorial-003 "Reading the Vote", but the Bend isn't purely two-party: East Hollow
#   has its own champion, the Independent Ada Hollis, who commands the east. The lesson is T3's —
#   the lines decide — extended to a third bloc: keep the Hollow together and Hollis contends or
#   wins that seat; crack it across districts and her support dilutes (packing/cracking, applied to
#   an independent). Whether she wins is EMERGENT from how the player draws, not hard-coded.
#
#   Still a legal-map tutorial: gates district_count + population_balance + contiguity, NO seat goal.
#   The result is shown to READ (repaint, watch who wins move), not to chase.

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: tutorial-005
  title: "Hawthorn Bend: The Hollow's Champion"
  election_type: state_house
  region:
    id: hawthorn_bend
    name: Hawthorn Bend

# ── Stage 1a: Map layout ──────────────────────────────────────────────────────
# Identical to T3 for familiarity (radius 5 = 91 precincts).

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 5

# ── Stage 1b: Terrain (COSMETIC scenery) ──────────────────────────────────────
# The same Bend river as T3 — cosmetic; districts may cross it freely.

terrain:
  river: { from: { q: 4, r: -5 }, via: [ { q: -2, r: 0 } ], to: { q: 0, r: 5 } }

# ── Stage 2: Population ───────────────────────────────────────────────────────
# T3's population shape: a central city (Hawthorn) on a rural base, with East Hollow and
# Westford villages. East Hollow is the Independent's home turf.

population:
  seed: 13
  base: 4000
  variance: 650
  smoothing: 0
  settlements:
    - label: Hawthorn (city)
      anchor: center
      peak: 3200
      radius: 2
      profile: plateau
    - label: East Hollow
      anchor: east
      peak: 1500
      radius: 2
      profile: gaussian
    - label: Westford
      anchor: west
      peak: 1500
      radius: 2
      profile: gaussian

# ── Stage 3: Demographics (THREE-WAY — a genuine three-cornered race) ──────────
#
# Three geographic bases, one per candidate, so three wedge districts can elect three
# different winners:
#   • WEST — Ken country (Sean carries the Ken banner).
#   • URBAN CORE — Hawthorn city leans Ryu (Sakura's base): the dense centre incl. the
#     hexes around the seat (0,0), (-1,0), (0,-1), (1,-1).
#   • EAST / the HOLLOW — Dhalsim, the unaffiliated local yogi, takes ~half and leads.
# Zone match is first-wins, so urban_core (a distance filter) precedes the q-band zones.
# GAME-116 weight model: primary (ken) gets base+jitter; the remainder (1 − ken) is split
# among the others by their party_base weights. Author all three to sum to ~1 for literal shares.

demographics:
  seed: 13
  parties: [ken, ryu, dhalsim]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: urban_core      # Hawthorn city core — Ryu (Sakura) country
      filter: { hex_dist_lte: 1 }
      party_base: { ken: 0.25, ryu: 0.60, dhalsim: 0.15 }
    - name: west            # Ken (Sean) country
      filter: { q_lte: -2 }
      party_base: { ken: 0.60, ryu: 0.30, dhalsim: 0.10 }
    - name: hollow          # East Hollow — Dhalsim's stronghold (he leads here)
      filter: { q_gte: 2 }
      party_base: { ken: 0.25, ryu: 0.25, dhalsim: 0.50 }
    - name: center          # inner ring around the core — leans Ryu, so a central seat is winnable
      filter: { default: true }
      party_base: { ken: 0.38, ryu: 0.47, dhalsim: 0.15 }

# ── Stage 3b: Counties ────────────────────────────────────────────────────────

counties:
  model: seat_and_hinterland
  target_count: 2
  id_prefix: hawthorn

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    - { id: ken, name: Ken Party, abbreviation: KEN, color: "#c96d00" }
    - { id: ryu, name: Ryu Party, abbreviation: RYU, color: "#7b35a8" }
    # The Independent — East Hollow's local champion, the unaffiliated yogi Dhalsim.
    # Gold (palette slot 3).
    - { id: dhalsim, name: Dhalsim (Independent), abbreviation: IND, color: "#f0c040" }
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
  default_district_id: d1
  guided: true
  hide_election_results: false
  hide_view_toolbar: false
  rules:
    population_tolerance: 0.15
    contiguity: required
  success_criteria:
    - id: sc-district-count
      required: true
      description: All three districts are in use and every precinct is assigned.
      criterion: { type: district_count }
    - id: sc-population-balance
      required: true
      description: All three districts have roughly equal population (within 15%).
      criterion: { type: population_balance }
  narrative:
    character:
      name: You
      role: Mapmaker, Hawthorn Bend
      motivation: >
        Three candidates are on the ballot in the Bend: Sean for the Ken Party out west, Sakura
        for the Ryu Party in the city, and Dhalsim — the unaffiliated yogi the Hollow reveres —
        running as an Independent in the east. Three bases, three corners. Where you draw the lines
        decides how many of them win.
    intro_slides:
      - heading: A Three-Cornered Race
        body: >
          The west is Ken country, where Sean runs strong. The city core leans Ryu behind Sakura.
          And out east, in the Hollow, the Independent Dhalsim takes about half the vote — ahead of
          both parties on his home ground.
      - heading: Three Bases, Three Corners
        body: >
          Each candidate has one part of the Bend. Draw a district around each base — west, city,
          Hollow — and all three can win a seat. Blur those lines and one base can swallow another,
          or split Dhalsim's Hollow until his half-here, half-there adds up to nothing.
    objective: >
      Draw three balanced, connected districts — a legal map, like before — and read the result.
      There's no seat to chase; repaint the lines and watch the three-cornered race change — can you
      draw a map where Sean, Sakura, and Dhalsim each carry a seat?
    epilogue: >
      A third voice changes the map. An Independent with a concentrated base is powerful when his
      community stays together and powerless when it's split — the same packing-and-cracking that
      moves seats between two parties. The lines don't just pick between two sides; they decide
      whose voice counts at all — and whether three corners can each keep their champion.
