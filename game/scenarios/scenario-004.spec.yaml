# Spec file for scenario-004: "Lakeview: Cracking the Opposition"
# Source of truth for the map generation pipeline (GAME-126 migration).
# Generated output: game/scenarios/scenario-004.json
#
# Migrated from the legacy gen-scenario-004.main.kts (GAME-126). The shipped JSON had
# drifted from that script — criteria `character` assignments, `instigator_character`, and
# `character_demographics` were added post-generation; this spec folds them in so the spec
# is the complete source. Bones (the r=0 Ryu corridor, the cracking lesson, criteria, and
# narrative) are preserved from the gen script + shipped JSON.
#
# Two pipeline features this migration adds (both faithful, additive, unit-tested):
#   - r_gte/r_lte ZoneFilter — selects the horizontal r=0 corridor (and the r-banded county
#     overlay). The pre-existing q_lte/q_gte/hex_dist_lte can only cut vertical/radial bands,
#     never a single row.
#   - row_band initial rule — reproduces the gen script's horizontal r-slabs EXACTLY
#     (r>=3 d1, r==2 d2, r>=-1 d3, r==-2 d4, else d5) as a max_r cascade. This is the failing
#     "old map" that packs the whole corridor into the center district (d3) so Ryu wins it
#     (4 Ken / 1 Ryu, also fails population_balance). diagonal_strip is NOT usable here: a
#     diagonal band cuts across r=0, distributing the corridor across all 5 districts, which
#     would pre-crack it and ship the puzzle already solved.
#
# FLAGGED for owner review (faithful reproduction of a shipped quirk, not introduced here):
#   - character_demographics.judge is "" (empty) in the shipped scenario-004.json. Reproduced
#     verbatim. Likely a pre-existing authoring gap (003 uses judge: naf); worth a look.
#
# Draft simplifications (GAME-126):
#   - Uniform population (base 1500 +/- 150); per-zone turnout dropped (unused in the sim).

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: scenario-004
  title: "Lakeview: Cracking the Opposition"
  election_type: state_house
  region:
    id: lakeview_county
    name: Lakeview County

# ── Stage 1: Map + terrain ────────────────────────────────────────────────────
#
# A pure political puzzle — no geographic features; precincts fill the full R=6 circle.

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 6

terrain: {}

# ── Stage 2: Population ───────────────────────────────────────────────────────
#
# Uniform field: base 1500 +/- 150, no terrain suitability and no settlement/gradient
# shaping. The cracking lesson is about partisan geography, not density.

population:
  seed: 44
  base: 1500
  variance: 150

# ── Stage 3: Demographics ─────────────────────────────────────────────────────
#
# The corridor geography (first-match-wins):
#   Corridor (r == 0, 13 hexes):  ken 0.18 — a narrow band of hard-Ryu lakeshore
#   Everywhere else (default):    ken 0.65 — reliable Ken territory
# County labels split the map into three horizontal bands (cosmetic overlay + names):
#   central |r| <= 1, north r >= 2, south r <= -2.

demographics:
  seed: 44
  parties: [ken, ryu]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: corridor
      filter: { r_gte: 0, r_lte: 0 }
      party_base: { ken: 0.18 }
    - name: rest
      filter: { default: true }
      party_base: { ken: 0.65 }
  county_labels:
    - id: lakeview_central
      filter: { r_gte: -1, r_lte: 1 }
    - id: lakeview_north
      filter: { r_gte: 2 }
    - id: lakeview_south
      filter: { default: true }

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    - { id: ken, name: Ken Party, abbreviation: KEN, color: "#c96d00" }
    - { id: ryu, name: Ryu Party, abbreviation: RYU, color: "#7b35a8" }
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
    - { id: d4, name: District 4 }
    - { id: d5, name: District 5 }
  default_district_id: d1
  # FAILING initial "old map": horizontal r-slabs that consolidate the r=0 corridor into the
  # center district d3 (r=-1..1). d3 holds all 13 corridor hexes + more -> Ryu wins it, and
  # the slabs are wildly unequal in size -> also fails population_balance. Result: 4 Ken / 1
  # Ryu. Reproduces gen-scenario-004's initialDistrict() exactly via a max_r cascade:
  #   r<=-3 d5, r<=-2 d4, r<=1 d3, r<=2 d2, default(r>=3) d1.
  initial_district_rule:
    type: row_band
    bands:
      - { max_r: -3, district: d5 }
      - { max_r: -2, district: d4 }
      - { max_r: 1,  district: d3 }
      - { max_r: 2,  district: d2 }
      - { default: true, district: d1 }
  rules:
    population_tolerance: 0.10
    contiguity: required
  success_criteria:
    - id: sc-district-count
      required: true
      description: All five districts are in use and every precinct is assigned.
      criterion: { type: district_count }
      character: commissioner
    - id: sc-population-balance
      required: true
      description: All five districts have roughly equal population (within 10%).
      criterion: { type: population_balance }
      character: commissioner
    - id: sc-ken-all-seats
      required: true
      description: Ken Party wins every seat — all 5 districts.
      criterion: { type: seat_count, party: ken, operator: gte, count: 5 }
      character: party
      party_id: ken
    - id: sc-mean-median
      required: false
      description: How skewed is your map? Mean-median gap ≤ 10%.
      criterion: { type: mean_median, party: ken, operator: lte, threshold: 0.10 }
      character: judge
  narrative:
    character:
      name: You
      role: Ken Party Redistricting Director, Lakeview County
      motivation: |-
        Last cycle, the Ryu Party won a seat in Lakeview by concentrating their voters along the lakeshore corridor. The Ken Party wants that seat back — and every other seat too. Your job: split the corridor so Ryu voters can't form a majority anywhere.
    intro_slides:
      - heading: The Corridor
        body: |-
          A narrow band of Ryu voters runs through the center of Lakeview County — along the lakeshore, where the apartments are dense and the politics lean hard Ryu.

          Right now, if those voters are in one district, they win it. Your predecessor let that happen. You won't.
      - heading: The Cracking Play
        body: |-
          Cracking is the opposite of packing. Instead of concentrating the opposition, you split them. Draw district lines that cut through the corridor, dividing Ryu voters across multiple districts.

          In each district, the corridor's Ryu precincts are outnumbered by the surrounding Ken territory. Ryu voters still vote — but they lose everywhere.
      - heading: The Disappearing Voice
        body: |-
          Notice what happens: a community that could win one seat now wins zero. Their total vote count hasn't changed. Their turnout hasn't dropped. But the lines moved, and their voice vanished.

          This is what cracking does. It doesn't silence voters — it dilutes them until they don't matter.
    objective: |-
      Crack the Ryu corridor across all 5 districts. Ken Party must win every seat.
  instigator_character: party
  character_demographics:
    commissioner: wm
    judge: ""
