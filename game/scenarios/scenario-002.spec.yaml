# Spec file for scenario-002: "Clearwater County: The Governor's Map"
# Source of truth for the map generation pipeline (GAME-084).
# Generated output: game/scenarios/scenario-002.json
#
# Stage completion:
#   [x] Stage 1: map + terrain  (terrain-generator.ts)
#   [x] Stage 2: population     (population-stage.ts)
#   [x] Stage 3: demographics   (demographics-stage.ts)
#   [x] Stage 4: assembly       (assembler.ts)

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: scenario-002
  title: "Clearwater County: The Governor's Map"
  election_type: state_house
  region:
    id: clearwater_county
    name: Clearwater County

# ── Stage 1a: Map layout ──────────────────────────────────────────────────────

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 5

# ── Stage 1b: Terrain placement ───────────────────────────────────────────────
#
# scenario-002 is a pure political puzzle with no geographic features.
# The terrain section is empty; precincts fill the full R=5 hex circle.

terrain: {}

# ── Stage 2: Population ───────────────────────────────────────────────────────
#
# Clearwater County urban/suburban mix — three density clusters so the field is
# non-monotonic (not a single cone) and the county stage gets clean seeds:
#   Clearwater City: the county seat, in the centre (dominant).
#   East Mills:      a mill town to the east.
#   West Bend:       a smaller town to the west.
# Settlements add Gaussian bumps on top of the terrain-suitability base; the
# gradient is kept gentle so the secondary towns survive as local maxima.

population:
  seed: 42
  base: 800                 # low rural floor; the cores (settlements) carry the density
  variance: 120
  # "Big core, low floor" experiment (A): near-zero gradient, big settlement peaks,
  # so density is core-defined with a ~5-7x urban/rural ratio rather than a smooth cone.
  gradient:
    strength: 0.05          # near-flat macro tilt — cores define density, not a radial slope
  smoothing: 2              # neighbour-average the jitter — removes salt-and-pepper
  contrast: 1.2             # mild; the peaks already carry the dynamic range
  target_total: 144891     # preserve the existing total (shape change, not magnitude)
  settlements:
    # City core sculpted from two overlapping plateaus so the dense area fans out
    # (an irregular blob with a sharp edge) instead of a smooth circular cone.
    - label: Clearwater City
      anchor: center
      peak: 4200
      radius: 3
      profile: plateau
    - label: Clearwater City (NE lobe)
      anchor: { q: 1, r: -1 }
      peak: 3200
      radius: 2
      profile: plateau
    - label: East Mills
      anchor: east
      peak: 2200
      radius: 2
      profile: plateau
    - label: West Bend
      anchor: west
      peak: 1400
      radius: 2
      profile: plateau

# ── Stage 3: Demographics ─────────────────────────────────────────────────────

demographics:
  seed: 42
  parties: [ken, ryu]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: west
      filter: { q_lte: 0 }
      party_base: { ken: 0.62 }
    - name: inner_east
      filter: { q_gte: 1, hex_dist_lte: 3 }
      party_base: { ken: 0.25 }
    - name: outer_east
      filter: { default: true }
      party_base: { ken: 0.52 }

# ── Stage 3b: Counties (GAME-089) ─────────────────────────────────────────────
#
# Cosmetic county boundaries that follow the population field (replaces the old
# geometric county_labels slices). county_id only drives the dashed border overlay.
#
# model: city_county — "like San Francisco / Denver": the dense Clearwater City
#   core becomes its own county; the surrounding area is absorbed by the West Bend
#   and East Mills counties. Gives a centred city county + a west + an east county.
# (Other presets: seat_and_hinterland = town+rural surround; split_metro = Portland.)

counties:
  model: city_county
  target_count: 3          # Clearwater City + West Bend + East Mills
  core_density: 0.32       # how far "out to a certain density" the city county reaches
  id_prefix: clearwater

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    - { id: ken, name: Ken Party, abbreviation: KEN }
    - { id: ryu, name: Ryu Party, abbreviation: RYU }
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
    - { id: d4, name: District 4 }
  default_district_id: d1
  initial_district_rule:
    type: diagonal_strip
    strips:
      - { max_k: -3, district: d1 }
      - { max_k: -1, district: d2 }
      - { max_k: 1,  district: d3 }
      - { default: true, district: d4 }
  rules:
    population_tolerance: 0.10
    contiguity: required
  success_criteria:
    - id: sc-district-count
      required: true
      description: All four districts are in use and every precinct is assigned.
      criterion: { type: district_count }
    - id: sc-population-balance
      required: true
      description: All four districts have roughly equal population (within 10%).
      criterion: { type: population_balance }
    - id: sc-ken-seats
      required: true
      description: The governor's Ken Party wins at least 3 of the 4 districts.
      criterion: { type: seat_count, party: ken, operator: gte, count: 3 }
      character: instigator
    - id: sc-compactness
      required: false
      description: All districts are reasonably compact (≥ 40%).
      criterion: { type: compactness, operator: gte, threshold: 0.40 }
  narrative:
    character:
      name: You
      role: Ken Party Campaign Strategist, Clearwater County
      motivation: >
        The governor wants a reliable majority in Clearwater County. The current
        map splits the vote evenly — two Ken, two Ryu. That's not good enough.
        You've been brought in to redraw the lines so Ken wins three of four seats.
    intro_slides:
      - heading: The Governor's Problem
        body: >
          Clearwater County elects four representatives. Right now, the map gives
          each party two seats. The governor — a Ken partisan — wants three.

          The population hasn't changed. The voters haven't changed. But the lines
          can change.
      - heading: How Redistricting Works
        body: >
          Every ten years, district boundaries are redrawn. The official reason is
          to reflect population changes. The real reason, often, is to change who
          wins.

          You're looking at a map of precincts — small geographic units with known
          voting patterns. Your job is to group them into districts that favor the
          Ken Party.
      - heading: Your First Gerrymander
        body: >
          Look at the map. The southeast corner votes heavily Ryu. The north and
          southwest lean Ken.

          If you can contain the Ryu stronghold in one district and spread Ken
          voters across the other three, the governor gets the majority. The tools
          are simple — the consequences are not.
    objective: Redraw the map so the Ken Party wins at least 3 of 4 districts.
  instigator_character: governor
  character_demographics:
    governor: bm
    commissioner: bf
    judge: lm
