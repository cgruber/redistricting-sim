# Spec file for tutorial-004: "Fairhaven: Putting It Together"
# Source of truth for the map generation pipeline (GAME-099).
# Generated output: game/scenarios/tutorial-004.json
#
# Regenerate:  bazel run //game/web/src/pipeline:generate_scenario -- \
#                game/scenarios/tutorial-004.spec.yaml game/scenarios/tutorial-004.json
#
# PEDAGOGY (see plan thoughts/shared/plans/2026-06-24-tutorial-redesign-pipeline-migration.md
# and DESIGN-012 / GAME-099):
#   Tutorial 4 is the CAPSTONE: a fuller map with every tool visible from the start (nothing
#   hidden, no reveal). The player puts together everything from T1-T3 — draw a legal map
#   (balanced + connected), and read the lean + the result — as the bridge into the real
#   electoral scenarios. A light guided script orients ("everything you've learned, one map")
#   then steps back.
#
#   JUDGMENT CALLS (flagged for review — iterate freely):
#     - The full LEGAL-MAP skill is gated: district_count + population_balance + contiguity (the
#       cumulative T1-T2 skills). No seat goal — winning by seats was never taught here; that's
#       the real campaign scenarios. The result is VISIBLE to read, the bridge, not the test.
#     - DECISION (2026-07-08, owner — GAME-127): the terrain rim-carve broke the four-cardinal-
#       WEDGE balance the capstone was originally built around (a natural quadrant carve now runs
#       E/W ~+17%, S ~−23% on the pointy-top hex, over ±15%). Resolved: ACCEPT the map as-is — the
#       capstone's win is a complete legal map reached via the Map Validity panel (the e2e proves a
#       balanced + contiguous partition exists: four EQUAL-POPULATION north–south layers). The
#       specific "even out four cardinal wedges" framing is retired; the taught skill is balance-
#       via-panel, and the field stays comfortably balanceable. The opposite-pair village design
#       below is kept (it still yields a symmetric, balanceable field); its old wedge-centric
#       wording is now vestigial. See thoughts/shared/plans/2026-07-07-game-127-terrain-inside-boundary.md.
#     - radius 6, 111 playable precincts (16 outer-ring cells are terrain), 4 districts — bigger
#       and more districts than T3.
#     - City view: the City overlay (GAME-096) still isn't built, so there's no #filter-city;
#       the map carries an urban core for when it ships. Lean + County + result are all visible.
#     - Topography (GAME-125, refined GAME-127): the mountain range (NW rim) and ocean (SE rim,
#       curling around the south vertex) sit ON the map's outer ring — each terrain tile replaces
#       the precinct on its cell, so the frame is PART of the r=6 map, not off-grid beyond it
#       (127 → 111 playable hexes). A river flows from the mountains out to that sea. All cosmetic
#       (terrain_weights pinned to 1.0); see Stage 1b.

format_version: "1"

# ── Scenario identity ─────────────────────────────────────────────────────────

scenario:
  id: tutorial-004
  title: "Fairhaven: Putting It Together"
  election_type: state_house
  region:
    id: fairhaven
    name: Fairhaven

# ── Stage 1a: Map layout ──────────────────────────────────────────────────────
#
# radius 6 = 127 hex cells; 16 outer-ring cells become terrain (GAME-127), leaving 111 playable
# precincts — still the largest tutorial map, four districts to draw.

map:
  geometry: hex_axial
  shape: hex_circle
  radius: 6

# ── Stage 1b: Terrain (COSMETIC) ──────────────────────────────────────────────
#
# The full topographic frame for the capstone (GAME-125, refined GAME-127): a mountain range along
# the NORTH-WEST rim, an ocean along the SOUTH-EAST rim that curls around the south vertex, and a
# river that flows OUT OF the mountains, bends through the interior, and empties into that sea.
#
# Terrain lives INSIDE the r=6 boundary and REPLACES the precinct on its cell (GAME-127): the frame
# is part of the map's OWN outer ring, not placed off-grid beyond it. The 16 rim cells it occupies
# drop out of the precinct set (127 → 111 playable hexes). On a radius-6 hex circle:
#   - mountains: the q+r = -6 edge — the whole NW rim (W-vertex → N-vertex), 7 tiles
#   - ocean:     the q+r = +6 edge (SE rim, E-vertex → S-vertex, 7 tiles) + two tiles curling west
#                along the bottom edge (r = 6) so the coast wraps the south vertex, 9 total
#   - river:     from the foot of the mountains (NW) to the last land before the coast (S)
#
# COSMETIC: every terrain weight is pinned to 1.0 in the population stage, so mountains and coast
# are scenery only. Left at defaults they would halve the NW wedge (mountain_adjacent 0.5) and
# thin the SE wedge (coastal 0.9), breaking the symmetric four-way balance this tutorial teaches.
# Districts may cross any of it — terrain is never a rule (the "geography is cosmetic" principle).

terrain:
  tiles:
    # Mountains — NW rim (q + r = -6), W-vertex end → N-vertex end. 7 tiles on the outer ring.
    - { q: -6, r: 0, type: mountain }
    - { q: -5, r: -1, type: mountain }
    - { q: -4, r: -2, type: mountain }
    - { q: -3, r: -3, type: mountain }
    - { q: -2, r: -4, type: mountain }
    - { q: -1, r: -5, type: mountain }
    - { q: 0, r: -6, type: mountain }
    # Ocean — SE rim (q + r = +6), E-vertex end → S-vertex end...
    - { q: 6, r: 0, type: sea }
    - { q: 5, r: 1, type: sea }
    - { q: 4, r: 2, type: sea }
    - { q: 3, r: 3, type: sea }
    - { q: 2, r: 4, type: sea }
    - { q: 1, r: 5, type: sea }
    - { q: 0, r: 6, type: sea }
    # ...curling west of the south vertex along the bottom edge (r = 6).
    - { q: -1, r: 6, type: sea }
    - { q: -2, r: 6, type: sea }
  # Routed river (GAME-100): from the foot of the NW mountains, bent west of the dense centre,
  # emptying into the sea near the south vertex. from/to are land cells adjacent to the terrain;
  # routeRiver snaps each to the mountain/coast rim by construction (mountains → sea).
  river: { from: { q: -3, r: -2 }, via: [ { q: -2, r: 2 } ], to: { q: 0, r: 5 } }

# ── Stage 2: Population ───────────────────────────────────────────────────────
#
# A central city on a textured rural base. Like T003: rural noise (variance) is left un-smoothed
# so the countryside reads as varied, and a few village peaks break up the fringe (giving the
# county stage extra seats and the map some life). The villages are placed in opposite pairs so
# the field stays symmetric and comfortably balanceable however the player carves it — balance is a
# skill to apply here, not an obstacle to fight.

population:
  seed: 21
  base: 4000
  variance: 650         # rural noise so the countryside reads as varied, not flat (matches T3)
  smoothing: 0          # keep the texture — don't average the noise away
  # COSMETIC terrain (GAME-125): pin every weight to 1.0 so the NW mountains and SE/south coast
  # do NOT reshape population. Defaults (mountain_adjacent 0.5, coastal 0.9, riverside 1.3) would
  # skew the symmetric field — with all weights 1.0 the field is the opposite-pair villages alone,
  # the clean balanceable design this tutorial relies on.
  terrain_weights:
    lakeside: 1.0
    riverside: 1.0
    coastal: 1.0
    mountain_adjacent: 1.0
  settlements:
    - label: Fairhaven (city)
      anchor: center
      peak: 2600
      radius: 2
      profile: plateau
    # Satellite towns ringing the city at the cardinals (N/E/S/W), in opposite pairs so they cancel
    # for population balance — keeping the field symmetric and comfortably balanceable however the
    # player carves it.
    - label: Millbrook
      anchor: north
      peak: 1200
      radius: 2
      profile: gaussian
    - label: Stonebridge
      anchor: south
      peak: 1200
      radius: 2
      profile: gaussian
    - label: Oakhollow
      anchor: east
      peak: 1300
      radius: 2
      profile: gaussian
    - label: Pinecrest
      anchor: west
      peak: 1300
      radius: 2
      profile: gaussian

# ── Stage 3: Demographics (PARTISAN — an east/west split) ─────────────────────
#
# Same east/west lean idea as T3, so the visible Lean view and result are meaningful: the
# west leans Ken, the east leans Ryu, the centre is a tossup.

demographics:
  seed: 21
  parties: [ken, ryu]
  group:
    id_suffix: all
    name: All voters
  turnout:
    min: 0.55
    max: 0.70
  jitter: 0.04
  zones:
    - name: west
      filter: { q_lte: -1 }
      party_base: { ken: 0.60 }
    - name: east
      filter: { q_gte: 1 }
      party_base: { ken: 0.40 }
    - name: center
      filter: { default: true }
      party_base: { ken: 0.50 }

# ── Stage 3b: Counties ────────────────────────────────────────────────────────

counties:
  model: seat_and_hinterland
  target_count: 3
  id_prefix: fairhaven

# ── Stage 4: Assembly ─────────────────────────────────────────────────────────

assembly:
  parties:
    # color: authored display colors (GAME-043) — kept in the spec so regeneration preserves them.
    - { id: ken, name: Ken Party, abbreviation: KEN, color: "#c96d00" }
    - { id: ryu, name: Ryu Party, abbreviation: RYU, color: "#7b35a8" }
  districts:
    - { id: d1, name: District 1 }
    - { id: d2, name: District 2 }
    - { id: d3, name: District 3 }
    - { id: d4, name: District 4 }
  default_district_id: d1
  # No initial_district_rule → opens as one district; the player carves four.
  guided: true                       # light guided orientation (GAME-076 / DESIGN-012, T4 script)
  hide_election_results: false       # capstone: everything is visible from the start...
  hide_view_toolbar: false           # ...nothing hidden, no reveal — all the tools at once
  rules:
    population_tolerance: 0.15        # generous — the player evens the districts out to pass
    contiguity: required             # a legal map: every district one connected piece
  success_criteria:
    # The full legal-map skill: four districts, all assigned, balanced, each connected. No seat
    # goal — the result is shown to read, not to hit. A passing map provably exists (the e2e wins it
    # with equal-population north–south layers); whether a NATURAL four-way split still balances after
    # the terrain rim-carve is the OPEN QUESTION flagged in the pedagogy header (pending owner review).
    - id: sc-district-count
      required: true
      description: All four districts are in use and every precinct is assigned.
      criterion: { type: district_count }
    - id: sc-population-balance
      required: true
      description: All four districts have roughly equal population (within 15%).
      criterion: { type: population_balance }
  narrative:
    character:
      name: You
      role: Mapmaker, Fairhaven
      motivation: >
        The whole toolkit, one map — bigger, four districts, everything on the table at once.
        Draw a legal map, read the result, and you've got the fundamentals cold.
    intro_slides:
      - heading: Everything You've Learned
        body: >
          This is the whole kit. Fairhaven is bigger — four districts — and nothing is hidden:
          the Map Validity panel, the Lean view, the County borders, and the election result
          are all here from the start. Draw a legal map and watch what it produces.
      - heading: A Complete Legal Map
        body: >
          A legal map is the same as ever: four districts, roughly equal in population, each one
          connected. The Map Validity panel tracks both — even the districts out and keep each
          whole until it's green. There's no seat target; read the result to see who your lines
          elect, then submit. Get this down and the maps ahead are the same craft with new twists.
    objective: >
      Draw four balanced, connected districts — a complete legal map — and read the result your
      lines produce, then submit. (No seat target; the outcome is yours to read, not to hit.)
    epilogue: >
      That's everything: pick a district and paint it, keep the populations even and each
      district whole, and read the lean and the result to see who your lines elect. You've got
      the whole loop now.

      Every race so far has come down to two sides. Next the map opens up — a third party with
      ground of its own to hold, then a candidate who answers to no party. Same tools, more
      corners to weigh. On to the three-way race.
