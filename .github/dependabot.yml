# Dependabot version-update PRs.
#
# SCOPE NOTE: this file governs Dependabot *version-update PRs* only. It does NOT
# affect Dependabot *security alerts* — those are generated from GitHub's dependency
# graph, which indexes every manifest in the repo, and there is no committed-config
# way to path-exclude a directory from alerts. (The early proof-of-concept spikes
# that previously triggered stray alerts have been removed; `/game` is now the only
# npm project, so this scoping is straightforward.)
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/game" # game/package.json — the live web game's deps
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One grouped PR per run instead of one-per-dependency, to keep noise low.
      npm:
        patterns:
          - "*"
